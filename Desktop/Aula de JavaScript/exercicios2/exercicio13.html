<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 13</title>
</head>
<body>
    <!--Escreva um programa  que leia 10 números do usuário e calcule a soma desses números.-->
    <h1>Exercicio 13</h1>

    <script>
        
        let soma = 0

        for(let i = 1; i <= 10; i++){
            let numUsuario = parseFloat(prompt("Digite um número"))
            soma = soma + numUsuario
        }

        document.write(`A soma dos 10 números são ${soma}`)

    </script>
</body>
</html>
