<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 04</title>
</head>
<body>
    <!--Crie um programa em javascript que leia a idade de uma pessoa e informe a sua classe eleitoral:  
· não eleitor (abaixo de 16 anos);  
· eleitor obrigatório (entre a faixa de 18 e menor de 65 anos); 
· eleitor facultativo (de 16 até 18 anos e maior de 65 anos, inclusive).-->
    <h1>Exercicio 04</h1>

    <script>
        let idade = parseInt(prompt("Digite a sua idade"))
        document.write(`Você tem: ${idade} anos`)

        if (idade < 16){
            document.write("<br> Você ainda não tem idade para votar")
        }else if(idade >= 18 && idade <= 65){
            document.write("<br> Você é obrigado a votar")
        }else{
            document.write("<br> O seu voto é optativo")
        }

    </script>
</body>
</html>
