<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 10</title>
</head>
<body>
    <!--  Escrever um programa que leia o nome de um vendedor, zo seu salário fixo e o total de vendas efetuadas por ele no mês (em dinheiro). Sabendo que este vendedor ganha 15% de comissão sobre suas vendas efetuadas, informar o seu nome, o salário fixo e salário no final do mês. -->
    <h1>Exercicio 10</h1>

    <script>
        let nomeVendedor =prompt("Digite o seu nome")
        let salarioFixo = parseFloat(prompt("Digite o seu sário Fixo"))
        let comissao = salarioFixo * 0.15
        let salarioTotal = salarioFixo + comissao

        document.write(`O nome do vendedor é: ${nomeVendedor}`)
        document.write(`<br> O Sálario Fixo do vendedor é: R$ ${salarioFixo}`)
        document.write(`<br> O valor da comissão do vendedor é: R$ ${comissao}`)
        document.write(`<br> O Sálario total do vendedor é: R$ ${salarioTotal}`)

    </script>
</body>
</html>
