<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 16</title>
</head>
<body>
    <!--Escreva um programa que leia a idade de 20 pessoas e exiba quantas pessoas são maiores de idade.-->
    <h1>Exercicio 16</h1>

    <script>
        
        let usuarioMIdade = 0

        for(let i = 1; i <= 20; i++){
            let idadeUsuario = parseFloat(prompt("Digite sua idade"))

            if(idadeUsuario >= 18){
                usuarioMIdade++
            }else{
                continue
            }
        }

        document.write(`Tem ${usuarioMIdade} pessoas maiores de idade`)
        
    </script>
</body>
</html>
