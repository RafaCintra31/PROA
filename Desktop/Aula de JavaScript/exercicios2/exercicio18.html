<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 18</title>
</head>
<body>
    <!--Elaborar um programa que efetue a apresentação do valor da conversão em real (R$) de um valor lido em dólar (US$). O programa deverá solicitar o valor da cotação do dólar e também a quantidade de dólares disponíveis com o usuário.-->
    <h1>Exercicio 18</h1>

    <script>
        let real = parseFloat(prompt("Digite quando em real você tem"))
        let cotacao = prompt ("Digite qual a cotação do dólar hoje")

        let conversao = real * cotacao

        document.write(`Você tem R$ ${real}`)
        document.write(`<br> A cotação do dólar  está R$ ${cotacao}`)
        document.write(`<br> Você tem $ ${conversao} dolares`)
    </script>
</body>
</html>
