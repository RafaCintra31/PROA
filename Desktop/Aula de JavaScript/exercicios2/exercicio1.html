<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 01</title>
</head>
<body>
    <!-- Escreva um programa em Javascript, que leia um número e informe se ele é divisível por 10, por 5 ou por 2 ou se não é divisível por nenhum deles.-->
    <h1>Exercicio 01</h1>

    <script>
        let num = parseFloat(prompt("Digite um número"))

        if(num % 10 === 0){
            document.write("Este número é divisivel por 10")
        }else if(num % 5 === 0){
            document.write("Este número é divisivel por 5")
        }else if (num % 2 === 0){
            document.write("Este número é divisivel por 2")
        }else{
            document.write("Este número é divisivel pelos número 10, 5 e 2")
        }
    </script>
</body>
</html>
