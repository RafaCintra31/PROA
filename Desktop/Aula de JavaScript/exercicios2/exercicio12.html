<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 12</title>
</head>
<body>
    <!--Ler uma temperatura em graus Celsius e apresentá-la convertida em graus Fahrenheit. A fórmula de conversão é: F=(9*C+160) / 5, sendo F a temperatura em Fahrenheit e C a temperatura em Celsius.-->
    <h1>Exercicio 12</h1>

    <script>
        let celsius = parseFloat(prompt("Digite a temperatura em celsius (só o numero)"))
        let conversão = (9 * celsius + 160) / 5

        document.write(`O seu graus em celsius é: ${celsius} ºC`)
        document.write(`<br> O seu graus em fahrenheit é: ${conversão} ºF`)
    </script>
</body>
</html>
