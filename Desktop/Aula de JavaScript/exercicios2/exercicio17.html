<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 17</title>
</head>
<body>
    <!--Escreva um programa que leia o nome e a idade de 10 pessoas e exiba o nome da pessoa mais nova. -->
    <h1>Exercicio 17</h1>

    <script>
         let usuarioMIdade = 0

        for(let i = 1; i <= 10; i++){
            let idadeUsuario = parseFloat(prompt("Digite sua idade"))
            

            if(idadeUsuario <= 18){
                usuarioMIdade++
            }else{
                continue
            }
        }

        document.write(`Tem ${usuarioMIdade} pessoas maiores de idade`)
        
    </script>
</body>
</html>
