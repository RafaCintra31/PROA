<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 21</title>
</head>
<body>
    <!--Faça um programa que leia 20 números e, ao final, escreva quantos estão entre 0 e 100.-->
    <h1>Exercicio 21</h1>

    <script>
        let num = 0

        for(let i = 1; i <= 20; i++){
            let numUsuario = parseFloat(prompt("Digite sua idade"))
            

            if(numUsuario >= 0 && numUsuario <=100){
                num ++
            }else{
                continue
            }
        }

        document.write(`Tem ${num} números entre 0 e 100`)
    </script>
</body>
</html>
