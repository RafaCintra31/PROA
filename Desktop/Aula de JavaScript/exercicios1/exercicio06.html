<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 06</title>
</head>
<body>
    
    <!--Desenvolva um algoritmo em Java que leia um número inteiro e imprima o seu antecessor e seu sucessor-->

    <h1>Exercicio 06</h1>

    <script>
        let numero = 10


            numero++
            document.write(" Numero sucessor " + numero)
            numero--
            document.write("<br> Numero " + numero)
            numero--
            document.write("<br> Numero antecesor " + numero)
            

    </script>
</body>
</html>
