<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 03</title>
</head>
<body>
    
    <!--Informar um saldo e imprimir o saldo com reajuste de 1%-->

    <h1>Exercicio 03</h1>

    <script>
        let saldo = parseFloat(prompt("Infome o seu saldo"))

        let reajuste = (saldo /100)*1
        let somaReajuste = reajuste + saldo

        document.write("O seu reajuste é de: R$" + reajuste + " reais")
        document.write("<br> O seu saldo com reajuste ficou: R$" + somaReajuste + " reais")
    </script>
</body>
</html>
