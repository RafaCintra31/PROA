<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando calculos usando o Javascript</title>
</head>
<body>
    <h1>Testando calculos usando o Javascript</h1>

    <script>
        let numero1 = parseFloat(prompt("Entre com o primeiro número"))
        document.write("O primeiro número é: " + numero1)

        let numero2 = parseFloat(prompt("Enrte com o segundo número"))
        document.write("<br> O segundo número é: " + numero2)

        let soma = numero1 + numero2
        let media = (numero1 + numero2) / 2
        let multiplicar = numero1 * numero2
        let divisao = numero1 / numero2

        document.write("<br> <br> A soma dos números são: " + soma)
        document.write("<br> A média dos números são: " + media)
        document.write("<br> A multiplicação dos números são: " + multiplicar)
        document.write("<br> A divisão dos números são: " + divisao)

    </script>
</body>
</html>
