<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 29</title>
</head>
<body>
    <!--29) Escreva um programa que leia uma matriz 3x3 de números inteiros e verifique se ela é uma matriz identidade.-->

    <h1>Exercicio 29</h1>

    <script>
        let matriz = [
            [1, 0, 0],
            [0, 1, 0],
            [0, 0, 1]
        ]

        let identidade = true;

        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
                if (i === j && matriz[i][j] !== 1) {
                    identidade = false;
                    break;
                }
                if (i !== j && matriz[i][j] !== 0) {
                    identidade = false;
                    break;
                }
            }
            if (!identidade) break;
        }

        if (identidade) {
            document.write("É uma matriz identidade");
        } else {
            document.write("Não é uma matriz identidade");
        }
    </script>
    
</body>
</html>
