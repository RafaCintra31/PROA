<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 11</title>
</head>
<body>
    <!--11) Escreva um programa que leia 10 números inteiros e exiba a soma dos valores positivos e a soma dos valores negativos.-->

    <h1>Exercicio 11</h1>

    <script>
        let listanum = []
        let quantPosi = 0
        let quantNeg = 0
        let somaPosi = 0
        let somaNeg = 0

        for(let i = 1; i <= 10; i++){
            let num = parseFloat(prompt(`Digite o ${i} número`))
            listanum.push(num)
        }

        document.write(`Lista: ${listanum} <br>`)

        for(let i = 0; i <= listanum.length; i++){
            if(listanum[i] >= 0){
            quantPosi = quantPosi + 1
            somaPosi = somaPosi + listanum[i]
            }

            if(listanum[i] <  0){
            quantNeg = quantNeg + 1
            somaNeg = somaNeg + listanum[i]
            }

        }
        
        document.write(`${quantPosi} números são positivos <br>`)
        document.write(`A soma dos números positivos são: ${somaPosi} <br>`)
        document.write(`${quantNeg} números são negativos <br>`)
        document.write(`A soma dos números positivos são: ${somaNeg} `)


    </script>
    
</body>
</html>
