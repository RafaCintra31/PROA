<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 02</title>
</head>
<body>
    <!--02) Escreva um programa que leia 10 números inteiros e exiba a soma deles.-->

    <h1>Exercicio 02</h1>
    <script>
        let listanum = []
        let soma = 0

        for(let i = 1; i <= 10; i++){
            let num = parseFloat(prompt(`Digite o ${i} número`))
            listanum.push(num)
        }

        for(let i = 0; i < listanum.length; i++){
            soma = soma + listanum[i]
        }

        document.write(listanum + "<br>")
        document.write(`Soma dos números da lista: ${soma}`)

        
    </script>
</body>
</html>
