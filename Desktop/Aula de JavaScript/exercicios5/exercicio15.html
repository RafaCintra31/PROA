<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 15</title>
</head>
<body>
    <!--15) Crie um programa que leia 5 nomes e exiba-os em ordem alfabética.-->

    <h1>Exercicio 15</h1>

    <script>
        let listaNomes = []

        for(let i = 1; i <= 5; i++){
            let nomes = prompt(`Digite o ${i} nome`)
            listaNomes.push(nomes)
        }

        document.write(`Lista de nomes original: ${listaNomes} <br>`)
        document.write(`Lista de nomes em ordem alfabética: ${listaNomes.sort()} `)
    </script>
    
</body>
</html>
