<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 10</title>
</head>
<body>
    <!--10)Faça um programa que leia 5 números inteiros e verifique se algum deles é igual a zero.-->

    <h1>Exercicio 10</h1>

    <script>
        let listanum = []
        let numZero = 0

        for(let i = 1; i <= 5; i++){
            let num = parseFloat(prompt(`Digite o ${i} número`))
            listanum.push(num)
        }

        document.write(listanum + "<br>")

        for(let i = 0; i <= listanum.length; i++){
            if(listanum[i] === 0){
                numZero = numZero + 1
            }
        }

        document.write(`Tem ${numZero} zero na lista`)
    </script>
    
</body>
</html>
