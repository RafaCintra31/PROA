<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 26</title>
</head>
<body>
    <!--26) Escreva um programa que leia duas matrizes 2x2 de números inteiros e verifique se elas são iguais.-->

    <h1>Exercicio 26</h1>

    <script>
        let matriz1 = [
            [1,2],
            [4,5],
        ]
        document.write("Matriz 1: <br>")

        for(let i = 0; i < 2; i++){
            let linha = ""
            for(let j = 0; j < 2; j++){
                linha = linha + matriz1[i][j] + ""
            }
            document.write(`${linha} <br>`)
        }

        let matriz2 = [
            [1,2],
            [4,5],
        ]
        document.write("Matriz 2: <br>")

        for(let i = 0; i < 2; i++){
            let linha = ""
            for(let j = 0; j < 2; j++){
                linha = linha + matriz2[i][j] + ""
            }
            document.write(`${linha} <br>`)
        }

        let iguais = true;

        for (let i = 0; i < 2; i++) {
            for (let j = 0; j < 2; j++) {
                if (matriz1[i][j] !== matriz2[i][j]) {
                    iguais = false;
                    break;
                }
            }
            if (!iguais) break;
        }

        if (iguais) {
            document.write("As matrizes são iguais");
        } else {
            document.write("As matrizes não são iguais");
        }
    </script>
</body>
</html>
