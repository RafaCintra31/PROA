<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 04</title>
</head>
<body>
    <!--04) Faça um programa que leia 5 números inteiros e exiba quantos deles são pares.-->

    <h1>Exercicio 04</h1>

    <script>
        let listanum = []

        for(let i = 1; i <= 5; i++){
            let num = parseFloat(prompt(`Digite o ${i} número`))
            listanum.push(num)
        }

        document.write(`Lista: ${listanum}`)

        for(let i = 0; i <= listanum.length; i++){
            if(listanum[i] % 2 === 0){
                document.write(`O número ${listanum[i]} é par <br>`)
            }
        }
    </script>
    
</body>
</html>
