<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 09</title>
</head>
<body>
    <!--09) Crie um programa que leia 10 números inteiros e exiba a quantidade de números positivos e a quantidade de números negativos.-->

    <h1>Execicio 09</h1>
    
    <script>
        let listanum = []
        let quantPosi = 0
        let quantNeg = 0

        for(let i = 1; i <= 10; i++){
            let num = parseFloat(prompt(`Digite o ${i} número`))
            listanum.push(num)
        }

        document.write(`Lista: ${listanum} <br>`)

        for(let i = 0; i <= listanum.length; i++){
            if(listanum[i] >= 0){
            quantPosi = quantPosi + 1
            }
            if(listanum[i] <  0){
            quantNeg = quantNeg + 1
            }

        }
        
        document.write(`${quantPosi} são positivos <br>`)
        document.write(`${quantNeg} são negativos`)
    </script>
</body>
</html>
