<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 06</title>
</head>
<body>
    <!--06) Crie um programa que leia 10 números inteiros e exiba-os em ordem crescente.-->

    <h1>Exercicio 06</h1>

    <script>
        let listanum = []

        for(let i = 1; i <= 10; i++){
            let num = parseFloat(prompt(`Digite o ${i} número`))
            listanum.push(num)
        }

        document.write(`Lista: ${listanum} <br>`)
        document.write("Lista de números na ordem crescente: " + listanum.sort((a,b) => a - b) + "<br>")
    </script>
    
</body>
</html>
