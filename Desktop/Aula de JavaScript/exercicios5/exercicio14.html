<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 14</title>
</head>
<body>
    <!--14) Escreva um programa que leia 7 números inteiros e exiba apenas os números pares.-->

    <h1>Exercicio 14</h1>

    <script>
        let listanum = []
        let listaPares = []

        for(let i = 1; i <= 7; i++){
            let num = parseFloat(prompt(`Digite o ${i} número`))
            if(num % 2 === 0){
                listanum.push(num)
            }
            
        }

        document.write(`Lista: ${listanum}`)

    </script>
    
</body>
</html>
