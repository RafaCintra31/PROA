<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 03</title>
</head>
<body>
    <!--03) Crie um programa que leia 7 números inteiros e exiba a média aritmética dos valores lidos.-->

    <h1>Exercicio 03</h1>

    <script>
        let listanum = []
        let soma = 0

        for(let i = 1; i <= 7; i++){
            let num = parseFloat(prompt(`Digite o ${i} número`))
            listanum.push(num)
        }

        for(let i = 0; i < listanum.length; i++){
            soma = soma + listanum[i]
        }

        let media = soma/7

        document.write(`Lista de números: ${listanum} <br>`)
        document.write(`Soma dos números da lista são: ${soma} <br>`)
        document.write(`A média aritmética dos números da lista são: ${media}`)

    </script>
    
</body>
</html>
