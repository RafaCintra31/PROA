<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 13</title>
</head>
<body>
    <!--13) Faça um programa que leia 10 números inteiros e exiba quantos deles estão no intervalo de 10 a 50.-->
    
    <h1>Exercicio 13</h1>
    
    <script>
        let listanum = []
        let quantNum = 0

        for(let i = 1; i <= 10; i++){
            let num = parseFloat(prompt(`Digite o ${i} número`))
            listanum.push(num)
        }

        document.write(`Lista: ${listanum} <br>`)

        for(let i = 0; i <= listanum.length; i++){
            if(listanum[i] >= 10 && listanum[i] <= 50){
                quantNum = quantNum + 1
            }
        }

        document.write(`Tem ${quantNum} números no intervalor entre 10 a 50`)
    </script>
</body>
</html>
