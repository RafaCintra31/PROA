<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 22</title>
</head>
<body>
    <!--22) Faça um programa que leia duas matrizes 2x2 de números inteiros e exiba o produto entre elas.-->

    <h1>Exercicio 22</h1>

    <script>
        let matrizA = [
            [1,2],
            [4,5]
        ]

        let matrizB = [
            [6,7],
            [8,9]
        ]

        let resultado = [
            [0,0],
            [0,0]
        ]

        for(let a = 0; a < 2; a++){
            for(let b = 0; b < 2; b++){
                for(let r = 0; r < 2; r++){
                    resultado[a][b] = resultado[a][b] + matrizA[a][r] * matrizB[r][b]
                }
            }
        }

        for(let i = 0; i < 2; i++){
            document.write(`${resultado[i].join(" ")} <br>`)
        }
    </script>
    
</body>
</html>
