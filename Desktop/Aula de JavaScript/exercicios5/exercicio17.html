<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 17</title>
</head>
<body>
    <!--17) Escreva um programa que leia uma matriz 2x2 de números inteiros e calcule a soma de todos os elementos.-->

    <h1>Exercicio 17</h1>

    <script>
        let matriz = [
            [1,2],
            [4,5],
        ]

        for(let i = 0; i < 2; i++){
            let linha = ""
            for(let j = 0; j < 2; j++){
                linha = linha + matriz[i][j] + ""
            }
            document.write(`${linha} <br>`)
        }

        let soma = 0
        
        for(let i = 0; i < 2; i++){
            for(let j = 0; j < 2; j++){
                soma = soma + matriz[i][j]
            }
        }

        document.write(`A soma da matris será: ${soma}`)
    </script>
    
</body>
</html>
