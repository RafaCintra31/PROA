<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 12</title>
</head>
<body>
    <!--12) Crie um programa que leia 5 números inteiros e exiba-os em ordem decrescente.-->

    <h1>Exercicio 12</h1>

    <script>
        let listanum = []

        for(let i = 1; i <= 10; i++){
            let num = parseFloat(prompt(`Digite o ${i} número`))
            listanum.push(num)
        }

        document.write(`Lista: ${listanum} <br>`)
        document.write("Lista de números na ordem decrescente: " + listanum.sort((a,b) => b - a) + "<br>")
    </script>
</body>
</html>
