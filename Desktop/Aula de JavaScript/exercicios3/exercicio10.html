<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exerciico 10</title>
</head>
<body>
    <!-- Escreva um programa para imprimir todas as tabuadas de 1 a N. N será informado pelo usuário.-->    

    <h1>Exerciico 10</h1>
    <script>
        let tabuada = parseFloat(prompt("Digite a tabuada desejada: "))
        let n = 1

        do{
            document.write(`${n} x ${tabuada} = ${tabuada * n} <br>`)
            n++
        }while(n <= 10)
    </script>
</body>
</html>
