<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

</head>
<body>
    <!--Escreva um algoritmo para imprimir os 10 primeiros números inteiros maiores que 100.-->

    <h1>Exerciico 9</h1>

    <script>
        for(let i = 101; i <= 110; i++){
            document.write(`${i} <br>`)
        }
       
    </script>
