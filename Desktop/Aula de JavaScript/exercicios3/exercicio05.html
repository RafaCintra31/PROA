<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exerciico 05</title>
</head>
<body>
    <!--Faça um algoritmo que calcule e escreva a média aritmética dos dois números inteiros informados pelo usuário e todos os números inteiros entre eles. Considere que o primeiro sempre será menor que o segundo.-->     

    <h1>Exerciico 05</h1>

    <script>
        let num1 = parseFloat(prompt("Digite o primeiro número inteiro"))
        document.write(`O primeiro número é: ${num1}<br>`)
        let num2 = parseFloat(prompt("Digite o segundo número inteiro"))
        document.write(`O segundo número é: ${num2}<br>`)
        let media = (num1 + num2) / 2
        document.write(`A média dos números são: ${media}<br>`)

        while(num1 <= num2){
            document.write(`Os números entre os números são: ${num1}<br> `)
            num1++
        }

        while(num2 <= num1){
            document.write(`Os números entre os números são: ${num2}<br> `)
            num2++
        }
      
    </script>
</body>
</html>
