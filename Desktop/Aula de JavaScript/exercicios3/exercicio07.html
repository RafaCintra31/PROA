<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exerciico 7</title>
</head>
<body>
    <!--Escreva um algoritmo para ler as notas de avaliações de um aluno, calcule e imprima a média (simples) desse aluno. Só devem ser aceitos valores válidos durante a leitura (0 a 10) para cada nota. São 6 notas ao total.
    Caso o valor informado para qualquer uma das notas esteja fora do limite estabelecido, deve ser solicitado um novo valor ao usuário. -->

    
    <h1>Exerciico 7</h1>
    <script>
        let soma = 0

        for(let i = 1; i <=6; i++){
            let nota = parseFloat(prompt(`Digite a  ${i}º nota (0 a 10):`))

            while(nota < 0 || nota > 10){
                nota = parseFloat(prompt("Nota inválida! Digite uma nota entra 0 e 10"))
            }

            soma = soma + nota
        }

        let media = soma / 6

        document.write(`A média do aluno é: ${media}`)
    </script>
</body>
</html>
