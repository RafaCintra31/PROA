<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exerciico 06</title>
</head>
<body>
    <!--Escreva um programa para ler 2 notas de um aluno, calcular e imprimir a média final. Considere que a nota de aprovação é 9,5. Logo após escrever a mensagem "Calcular a média de outro aluno Sim/Não?" e solicitar um resposta. Se a resposta for "S", o programa deve ser executado novamente, caso contrário deve ser encerrado exibindo a quantidade de alunos aprovados.-->
    
    <h1>Exerciico 06</h1>
    <script>
    let aprovado = 0
    let pergunta = "S"
    let resultado =""

    while(pergunta === "S"){
        let nota1 = parseFloat(prompt("Digite a primeira nota"))
        let nota2 = parseFloat(prompt("Digite a segunda nota"))
        let media = (nota1 + nota2)/2

        if(media >= 9.5){
            aprovado++
        }

        resultado = resultado + `Média do final do aluno é: ${media} <br>`
        pergunta = prompt("Quer calcular a média de outro aluno?").toLocaleUpperCase();
    
    }

    resultado = resultado + `A quantidade de aluno que foram aprovados, são: ${aprovado}`
    document.write(resultado)

        


    </script>
</body>
</html>
