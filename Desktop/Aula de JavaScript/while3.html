<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando usando While</title>
</head>
<body>
    <h1>Testando usando While</h1>

    <script>
        let n = 0
        let nome = prompt("Digite o seu nome")

        while(n<=10){
            document.write(`${n} = ${nome} <br>`)
            n++
        }
    </script>
</body>
</html>
