<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comandos Condicionais usando Javascript</title>
</head>
<body>
    
    <h1>Testando Comandos if - else if - else</h1>

    <script>
        let cor = prompt("Digite uma cor do semafaro")

        if(cor == "vermelho"){
            alert("Pare! O sinal está vermelho")
        }else if(cor == "amarelo"){
            alert("Atenção! O sinal está amarelo")
        }else if(cor == "verde"){
            alert("Prosiga! O sinal está verde")
        }else{
            alert("Cor inválida")
        }
        
    </script>
</body>
</html>
