<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 16</title>
</head>
<body>
    <!--16) Faça um programa que exiba os números de 1 a 10 usando o loop "do-while".-->

    <h1>Exercicio 16</h1>

    <script>
        let num = 1

        do{
            document.write(`${num} <br>`)
            num++
        }while(num <= 10)
    </script>
</body>
</html>
