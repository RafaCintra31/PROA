<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 37</title>
</head>
<body>
    <!--37) Faça um programa que leia um número inteiro e exiba se ele é um número primo.-->

    <h1>Exercicio 37</h1>

    <script>
        let numero = parseFloat(prompt("Digite um número"))
        let primo = true

        if (numero <= 1) {
            primo = false
        }

        for(let divisor = 2; divisor < numero && primo; divisor++) {
            if (numero % divisor == 0) {
                primo = false
            }
        }

        if (primo) {
            document.write(`${numero} é um número primo`)
        } else {
            document.write(`${numero} não é um número primo`)
        }
    </script>
</body>
</html>
