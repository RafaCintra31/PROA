<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 34</title>
</head>
<body>
    <!--34) Faça um programa que leia 5 números inteiros e exiba a média aritmética dos valores lidos.-->

    <h1>Exercicio 34</h1>

    <script>
        let soma = 0
        
        for(let num = 1; num <= 5; num++){
            let numInteiro = parseFloat(prompt(`Digite o ${num} número (só pode números inteiros)`))
            soma = soma + numInteiro
        }

        soma = soma / 5
        
        document.write(`A soma dos 5 números inteios são: ${soma}`)
    </script>
</body>
</html>
