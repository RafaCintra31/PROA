<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 40</title>
</head>
<body>
    <!--40) Faça um programa que exiba os primeiros 20 números da sequência de Fibonacci.-->

    <h1>Exercicio 40</h1>

    <script>
        let num1 = parseFloat(prompt(`Digite 1 número inteiro`))
        let num2 = num1

        for(let soma = 0; soma < 20; soma++){
            document.write(`${num1} <br>`)
            
            let proximoNum = num1 + num2
            num1 = num2
            num2 = proximoNum
        }
       
    </script>
</body>
</html>
