<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 18</title>
</head>
<body>
    <!--18) Crie um programa que exiba os números pares de 1 a 50 usando o loop "do-while".-->

    <h1>Exercicio 18</h1>

    <script>
        let num = 1

        do{
            if(num % 2 == 0){
                document.write(`${num} <br>`)
            }     
            num++
        }while(num <= 50)
    </script>
</body>
</html>
