<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 17</title>
</head>
<body>
    <!--17) Escreva um programa que calcule a soma dos números de 1 a 100 usando o loop "do-while".-->

    <h1>Exercicio 17</h1>

    <script>
        let num = 1
        let soma = 0

        do{
            document.write(`${num} <br>`)
            soma = soma + num
            num++
        }while(num <= 100)

        document.write(`A soma dos números são: ${soma}`)
    </script>
</body>
</html>
