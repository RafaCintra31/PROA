<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 27</title>
</head>
<body>
    <!--27) Crie um programa que exiba os números ímpares de 1 a 50 usando o loop "do-while".-->

    <h1>Exercicio 27</h1>

    <script>
    let num = 1;

    do{
        document.write(`${num} <br>`)
        num = num + 2
    }while (num <= 50) 
    </script>
</body>
</html>
