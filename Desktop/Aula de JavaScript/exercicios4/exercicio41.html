<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 41</title>
</head>
<body>
    <!--41) Escreva um programa que leia um número inteiro e exiba a soma de todos os números pares entre 1 e o número lido.-->

    <h1>Exercicio 41</h1>

    <script>
        let numUsuario = parseFloat(prompt(`Digite 1 número inteiro`))
        let soma = 0

        for(let n = 1; n <= numUsuario; n++){
            if(n % 2 == 0){
                document.write(`${n} <br>`)
                soma = soma + n
            }
        }

        document.write(`A soma dos números pares são ${soma}`)
       
    </script>
</body>
</html>
