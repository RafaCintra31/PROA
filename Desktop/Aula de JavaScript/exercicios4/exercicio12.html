<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 12</title>
</head>
<body>
    <!--12) Crie um programa que exiba os números ímpares de 1 a 50 usando o loop "while".-->

    <h1>Exercicio 12</h1>

    <script>
    let num = 1;

    while (num <= 50) {
        document.write(`${num} <br>`)
        num = num + 2
    }
    </script>
</body>
</html>
