<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 24</title>
</head>
<body>
    <!--24) Crie um programa que leia o nome e a idade de 5 pessoas usando o loop "do-while" e exiba a média das idades.-->

    <h1>Exercicio 24</h1>

    <script>
        let n = 1
        let soma = 0

        do{
            let numIdade = parseFloat(prompt(`Digite a ${n} idade`))
            document.write(`a idade é: ${numIdade} <br>`)
            soma = soma + numIdade
            n++
        }while(n <= 5)

        let media = soma / 5
        document.write(`A média das idades são: ${media}`)

       
    </script>
</body>
</html>
