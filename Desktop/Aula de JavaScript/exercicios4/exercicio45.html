<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 45</title>
</head>
<body>
    <!--45) Crie um programa que leia o nome e a idade de várias pessoas até que o nome "fim" seja informado. Ao final, exiba a média das idades.-->

    <h1>Exercicio 45</h1>

    <script>
        let somaIdades = 0
        let quantidade = 0
        let nome

        for (nome = prompt("Digite o nome (ou 'fim' para encerrar)");
            nome.toLowerCase() != "fim";
            nome = prompt("Digite o nome (ou 'fim' para encerrar)")) {
    
            let idade = parseInt(prompt("Digite a idade:"))
            somaIdades = somaIdades + idade
            quantidade++
        }

        if (quantidade > 0) {
            let media = somaIdades / quantidade
            document.write(`A média das idades é: ${media}`)
        } else {
            document.write("Nenhuma idade foi informada.")
        }
       
    </script>
</body>
</html>
