<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando calculos usando o Javascript</title>
</head>
<body>
    <h1>Testando calculos usando o Javascript</h1>

    <script>
        let nota1 = parseFloat(prompt("Nota 1"))
        document.write("A nota 1 é: " + nota1)

        let nota2 = parseFloat(prompt("Nota 2"))
        document.write("<br> A nota 2 é: " + nota2)

        let nota3 = parseFloat(prompt("Nota 3"))
        document.write("<br> A nota 3 é: " + nota3)

        let nota4 = parseFloat(prompt("Nota 4"))
        document.write("<br> A nota 4 é: " + nota4)

        let soma = nota1 + nota2 + nota3 + nota4 
        let media = (nota1 + nota2 + nota3 + nota4) / 4
        
        document.write("<br> <br> A soma das notas são: " + soma)
        document.write("<br> A média das notas são: " + media)

    </script>
</body>
</html>
