<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando usando Do While</title>
</head>
<body>
    <h1>Testando usando Do While</h1>

    <script>
         let tabuada = parseFloat(prompt("Digite a tabuada desejada: "))
         let n = 1

            do{
            document.write(`${n} x ${tabuada} = ${tabuada * n} <br>`)
            n++
        }while(n <= 10)
    </script>
</body>
</html>
