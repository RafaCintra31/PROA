<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel</title>
</head>
<body>
    <h1>Hotel</h1>
    <script>
            function inicio() {
        let opcao = Number(prompt(
            "1 - Reservar quarto\n" +
            "2 - Cadastro de hóspedes\n" +
            "3 - Pesquisa\n" +
            "0 - Sair"
        ));

        switch (opcao) {
            case 1:
                reservarQuarto();
                break;
            case 2:
                cadastroHospedes();
                break;
            case 3:
                pesquisarHospedes();
                break;
            case 0:
                sair();
                break;
            default:
                alert("Opção inválida");
                inicio();
        }
    }

    let hotel = prompt("Nome do hotel:");
    let usuario = prompt("Seu nome:");
    let senha = Number(prompt("Digite a senha:"));

    if (senha !== 2678) {
        alert("Senha incorreta");
    } else {
        alert(`Bem-vindo ao Hotel ${hotel}, ${usuario}`);
        inicio();
    }

    `texto ${variavel}`

    function reservarQuarto() {
        let diaria = Number(prompt("Valor da diária:"));
        let dias = Number(prompt("Quantos dias:"));

        if (diaria <= 0 || dias <= 0 || dias > 30) {
            alert("Valor inválido");
            return;
        }

        let total = diaria * dias;

        alert(`O valor total é R$ ${total}`);
        inicio();
    }

    let hospedes = [];

    function cadastroHospedes() {
        let nome = prompt("Nome do hóspede:");
        hospedes.push(nome);

        alert("Hóspede cadastrado");
        inicio();
    }

    hospedes.push(nome)

    function pesquisarHospedes() {
        let nome = prompt("Digite o nome:");

        if (hospedes.includes(nome)) {
            alert("Hóspede encontrado");
        } else {
            alert("Hóspede não encontrado");
        }

        inicio();
    }

    function cadastrarVarios() {
        while (true) {
            let nome = prompt("Digite o nome:");

            if (nome === "PARE") {
                break;
            }

            hospedes.push(nome);
        }

        inicio();
    }

    function evento() {
        let garcons = Number(prompt("Quantidade de garçons:"));
        let horas = Number(prompt("Horas do evento:"));

        let custo = garcons * horas * 10.5;

        alert(`Custo total: R$ ${custo}`);
        inicio();
    }
    </script>
</body>
</html>
