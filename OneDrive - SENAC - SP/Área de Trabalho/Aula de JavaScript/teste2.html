<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando comandos usando Javascript</title>
</head>
<body>
    
    <h1>Testando comandos usando Javascript</h1>

    <script>
        let nome = "Rafa" // variável do tipo string (letras, numeros e caracteres especiais)
        let idade = 20 // variável do tipo int ( valores numericos inteiros)
        let altura = 1.70 //variável do tipo float ( valor numericos quebrados - com virgulas)
        let salario = 1000.00 // variável tipo double (valores que usam muito espaço em memoria)
        let mestrado = false // variável do tipo boolean ( verdadeiro ou falso)

        document.write("Meu nome é: " + nome)
        document.write("<br> Minha idade é: " + idade)
        document.write("<br> Minha idade é: " + altura)
        document.write("<br> Meu salário é: " + salario)
        document.write("<br> Eu tenho mestrado: " + mestrado)

        let nome2 = "Lidia"
        let idade2 = 60 
        let altura2 = 1.68 
        let salario2 = 1500.00
        let mestrado2 = true 

        document.write("<br> <br> Meu nome é: " + nome2)
        document.write("<br> Minha idade é: " + idade2)
        document.write("<br> Minha idade é: " + altura2)
        document.write("<br> Meu salário é: " + salario2)
        document.write("<br> Eu tenho mestrado: " + mestrado2)

    </script>

</body>
</html>
