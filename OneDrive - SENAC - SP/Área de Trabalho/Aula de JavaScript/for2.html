<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando laços usando FOR</title>
</head>
<body>
    <h1>Testando laços usando FOR</h1>

    <script>
        let frase = prompt("Digite a tabuada desejada: ")

        for(let n = 1; n <= 50; n++){
            document.write(`${n} = ${frase} <br>`)
        }
    </script>
</body>
</html>
