<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 15</title>
</head>
<body>
    <!--15) Crie um programa que leia o nome e a idade de várias pessoas usando o loop "while" até que o nome "fim" seja informado. Ao final, exiba a média das idades.-->

    <h1>Exercicio 15</h1>

    <script>
        let nome = ""
        let idade = 0
        let idadeSoma = 0
        let quantIdade = 0

        while(nome.toLowerCase() != "fim"){
            nome = prompt("Digite seu nome - ou fim para o final da execução")

            if(nome.toLowerCase() != "fim"){
                idade = parseFloat(prompt("Digite asua idade"))
                idadeSoma = idadeSoma + idade
                quantIdade++
            }
        }

        let mediaIdade = idadeSoma / quantIdade
        document.write(`A média da idade são: ${mediaIdade}`)
       
    </script>
</body>
</html>
