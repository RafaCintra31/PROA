<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 42</title>
</head>
<body>
    <!--42) Crie um programa que exiba os números ímpares de 50 a 1.-->

    <h1>Exercicio 42</h1>

    <script>
        for (let num = 49; num >= 1; num -= 2) {
            document.write(`${num} <br>`);
        }
    </script>
</body>
</html>
