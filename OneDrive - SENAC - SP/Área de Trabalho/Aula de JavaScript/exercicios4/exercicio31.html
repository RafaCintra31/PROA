<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 31</title>
</head>
<body>
    <!--31) Faça um programa que exiba os números de 1 a 10.-->

    <h1>Exercicio 31</h1>

    <script>
        for(let num = 1; num <= 10; num++){
            document.write(`${num} <br>`)
        }
    </script>
</body>
