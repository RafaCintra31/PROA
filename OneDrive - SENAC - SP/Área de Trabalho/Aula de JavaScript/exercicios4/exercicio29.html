<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 29</title>
</head>
<body>
    <!--29) Escreva um programa que calcule o fatorial de um número inteiro inserido pelo usuário usando o loop "do-while".-->

    <h1>Exercicio 29</h1>

    <script>
        let numInserido = parseFloat(prompt("Digite um número inteiro"))
        let soma = numInserido
        let fatorial = 1

        do{
            fatorial = fatorial * soma 
            soma--
        }while(soma > 0)

            document.write(`O fatorial do número ${numInserido} é: ${fatorial}`)
       
    </script>
</body>
</html>
