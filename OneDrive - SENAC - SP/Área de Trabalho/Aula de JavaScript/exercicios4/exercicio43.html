<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 43</title>
</head>
<body>
    <!--43) Faça um programa que leia um número inteiro e exiba os seus dígitos separadamente.-->

    <h1>Exercicio 43</h1>

    <script>
        let num = parseInt(prompt("Digite um número inteiro com mais de 2 casas decimais"));

        for (; num > 0; num = Math.floor(num / 10)) {
            let digito = num % 10;
            document.write(`${digito} <br>`);
        }
       
    </script>
</body>
</html>
