<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 13</title>
</head>
<body>
    <!--13)Faça um programa que leia um número inteiro e exiba os seus dígitos separadamente usando o loop "while".-->

    <h1>Exercicio 13</h1>

    <script>
        let num = parseFloat(prompt("Digite um número com mais de 2 casas decimais"))

        while(num > 0){
            let digito = num % 10
            document.write(`${digito} <br>`)
            num = Math.floor(num/10)
        }
       
    </script>
</body>
</html>
