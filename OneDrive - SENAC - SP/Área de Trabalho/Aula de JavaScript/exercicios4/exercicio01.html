<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 01</title>
</head>
<body>
    <!--1) Faça um programa que exiba os números de 1 a 10 usando o loop "while".-->

    <h1>Exercicio 01</h1>

    <script>
        let num = 1

        while(num <= 10){
            document.write(`${num} <br>`)
            num++
        }
    </script>
</body>
</html>
