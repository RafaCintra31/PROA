<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 04</title>
</head>
<body>
    <!--4) Faça um programa que leia 5 números inteiros usando o loop "while" e exiba a média aritmética dos valores lidos.-->

    <h1>Exercicio 04</h1>

    <script>
        let soma = 0
        let num = 1

        while(num <= 5){
            let numInteiro = parseFloat(prompt(`Digite o ${num} número (só pode números inteiros)`))
            soma = soma + numInteiro
            num++
        }

        soma = soma / 5
        document.write(`A soma dos 5 números inteios são: ${soma}`)
    </script>
</body>
</html>
