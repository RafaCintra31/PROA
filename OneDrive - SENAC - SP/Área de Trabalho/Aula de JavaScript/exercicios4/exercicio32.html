<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 32</title>
</head>
<body>
    <!--32) Escreva um programa que calcule a soma dos números de 1 a 100.-->

    <h1>Exercicio 32</h1>

    <script>
        let soma = 0

        for(let num = 1; num <= 100; num++){
            document.write(`${num} <br>`)
            soma = soma + num
            
        }
        document.write(`A soma dos números são: ${soma}`)
    </script>
</body>
</html>
