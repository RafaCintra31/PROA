<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 33</title>
</head>
<body>
    <!--33) Crie um programa que exiba os números pares de 1 a 50.-->

    <h1>Exercicio 33</h1>

    <script>
        

        for(let num = 1; num <= 50; num++){
            if(num % 2 == 0){
                document.write(`${num} <br>`)
            }     
        }
    </script>
</body>
</html>
