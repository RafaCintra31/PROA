<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exerciico 8</title>
</head>
<body>
    <!--Ler um valor N e imprimir todos os valores inteiros entre 1 (inclusive) e N (inclusive). Considere que o N será sempre maior que ZERO.
    N  é um valor informado pelo usuário -->

    <h1>Exerciico 8</h1>

    <script>
        let valorN = parseFloat(prompt("Digite um número"))
        let num = 1

        while(num <= valorN){
            document.write(`Números entre 1 e N${valorN}: ${num} <br>`)
            num++
        }
    </script>
</body>
</html>
