<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exerciico 04</title>
</head>
<body>
    <!--Faça um algoritmo que calcule e escreva a média aritmética dos números inteiros entre 15 (inclusive) e 100 (inclusive).-->
     <h1>Exercicio 04</h1>

    <script>
        let n = 15
        let soma = 0

        while(n <= 100){
            document.write(`Número ${n} <br>`)
            soma = soma + n 
            document.write(`Soma dos números são: ${soma} <br>`)
            n++
        }
        soma = soma/85
        document.write(`A média aritmética é: ${soma.toFixed(2)}`)
    </script>
</body>
</html>
