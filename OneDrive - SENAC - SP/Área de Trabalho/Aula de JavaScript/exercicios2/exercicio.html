<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 01</title>
</head>
<body>
    <!--1-Criar um programa em Javascript, que informe a quantidade total de calorias de uma
        refeição a partir do usuário que deverá informar o prato, a sobremesa e a bebida (veja a
        tabela a seguir).

        Sugestão: enumere cada opção de prato, sobremesa e bebida. Ou seja: Prato: 1 -
        vegetariano 350 kcal., 2 – Peixe 360 kcal., 3 – Frango 400 kcal., 4 – Carne 450 kcal.; Sobremesa: 1 – Abacaxi 100 kcal, 2 – Sorvete diet 150 kcal, 3 –
        Mouse diet 150 kcal, 4 – Mouse chocolate 198kcal; Bebida: 1 – Chá 50 kacl, 2 - Suco de laranja 80 kcal, 3 – Suco de melão 40 kcal, 4
         Refrigerante diet 0kcal-->
    <h1>Exercicio Swith/case</h1>

    <script>
        let prato = parseInt(prompt("Digite o numero do seu prato (são 4 opções)"))
        let desprato;
        let valkcalPrato;
        let sobremesa = parseInt(prompt("Digite o número da sobremesa(são 4 opções) "))
        let desSobremesa;
        let valkcalSobremesa;
        let bebida = parseInt(prompt("Digite o número da sua bebida (são 3 opções)"))
        let desbebida;    
        let valkcalBebida;

        switch(prato){
            case 1: desprato = "Vegetariano"; valkcalPrato = 350;
            break
            case 2: desprato = "Peixe";  valkcalPrato =  360 
            break
            case 3: desprato = "Frango";  valkcalPrato =  400 
            break
            case 4: desprato = "Carne";  valkcalPrato =  450 
            break
        }
        document.write(`Seu prato é: ${desprato}`)

        switch(sobremesa){
            case 1: desSobremesa = "Abacaxi"; valkcalSobremesa = 100;
            break
            case 2: desSobremesa = "Sorvete diet";  valkcalSobremesa = 150 
            break
            case 3: desSobremesa = "Mouse diet";  valkcalSobremesa = 150 
            break
            case 4: desSobremesa = "Mouse chocolate";  valkcalSobremesa = 198 
            break
        }
        document.write(`<br> Sua sobremessa é: ${desSobremesa}`)

        switch(bebida){
            case 1: desbebida = "Chá "; valkcalBebida = 50;
            break
            case 2: desbebida = "Suco de laranja ";  valkcalBebida = 80 
            break
            case 3: desbebida = "Suco de melão ";  valkcalBebida = 40 
            break
            case 4: desbebida = "Refrigerante diet";  valkcalBebida = 0 
            break
        }
        document.write(`<br> Sua bebida é: ${desbebida}`)

        let refeição = valkcalPrato + valkcalSobremesa + valkcalBebida
        document.write(`<br> A sua refeição tem: ${refeição} kcal`)

    </script>
</body>
</html>
