<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 06</title>
</head>
<body>
    <!--Fazer um programa que mostre na tela a média aritmética dos números 8,9 e 7. A média dos números 4, 5 e 6. A soma das duas médias. A média das médias.-->
    <h1>Exercicio 06</h1>

    <script>
        let numero1 = 7
        let numero2 = 8
        let numero3 = 9

        let soma = numero1 + numero2 + numero3
        let media = (numero1 + numero2 + numero3) / 3

        document.write("Número 1: " + numero1)
        document.write("<br> Número 2: " + numero2)
        document.write("<br> Número 3: " + numero3)
        document.write("<br> A soma dos números são: " + soma)
        document.write("<br> A média dos números são: " + media)


        let numero4 = 4
        let numero5 = 5
        let numero6 = 6

        let soma2 = numero4 + numero5 + numero6
        let media2 = (numero4 + numero5 + numero6) / 3

        document.write("<br> <br> Número 4: " + numero4)
        document.write("<br> Número 5: " + numero5)
        document.write("<br> Número 6: " + numero6)
        document.write("<br> A soma dos números são: " + soma2)
        document.write("<br> A média dos números são: " + media2)
    </script>
</body>
</html>
