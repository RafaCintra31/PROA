<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 15</title>
</head>
<body>
    <!-- Escreva um programa que leia a idade de 20 pessoas e exiba a média das idades.-->
    <h1>Exercicio 15</h1>

    <script>
        let soma = 0

        for(let i = 1; i <= 20; i++){
            let idadeUsuario = parseFloat(prompt("Digite sua idade"))
            soma = soma + idadeUsuario
        }

        let mediaIdades = soma / 20
        document.write(`A soma das 20 idades são ${soma} anos`)
        document.write(`<br> A média das 20 idades são ${mediaIdades} anos`)
    </script>
</body>
</html>
