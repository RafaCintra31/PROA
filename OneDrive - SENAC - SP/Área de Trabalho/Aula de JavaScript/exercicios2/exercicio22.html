<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 22</title>
</head>
<body>
    <!--Faça um programa que leia 20 números e, ao final, escreva quantos estão entre 0 e 100, quantos estão entre 101 e 200 e quantos são maiores de 200.-->
    <h1>Exercicio 22</h1>

    <script>
        let num1 = 0
        let num2 = 0
        let num3 = 0

        for(let i = 1; i <= 20; i++){
            let numUsuario = parseFloat(prompt("Digite sua idade"))
            

            if(numUsuario >= 0 && numUsuario <=100){
                num1++
            }else if(numUsuario >= 101 && numUsuario <=200){
                num2++
            }else if(numUsuario >200){
                num3++
            }else{
                continue
            }
        }

        document.write(`Tem ${num1} números entre 0 e 100`)
        document.write(`<br> Tem ${num2} números entre 101 e 200`)
        document.write(`<br> Tem ${num3} números que são maiores que 200`)
    </script>
</body>
</html>
