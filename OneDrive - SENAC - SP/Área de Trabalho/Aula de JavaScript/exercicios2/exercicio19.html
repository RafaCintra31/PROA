<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 19</title>
</head>
<body>
    <!--Escreva um programa que leia 20 números do usuário e exiba quantos números são maiores do que 8.-->
    <h1>Exercicio 19</h1>

    <script>
         let numMaiorOito = 0

        for(let i = 1; i <= 20; i++){
            let numUsuario = parseFloat(prompt("Digite sua idade"))
            

            if(numUsuario >= 8){
                numMaiorOito ++
            }else{
                continue
            }
        }

        document.write(`Tem ${numMaiorOito} números maiores que 8`)
        
    </script>
</body>
</html>
