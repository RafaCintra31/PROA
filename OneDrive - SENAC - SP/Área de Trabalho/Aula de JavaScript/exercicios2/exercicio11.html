<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 11</title>
</head>
<body>
    <!--  Escreva um programa que calcule a soma dos números de 1 a 15.  -->
    <h1>Exercicio 11</h1>

    <script>
        let i = 1
        let soma = 0

        while(i <= 15){
         soma = i + soma
            i++
        }

        document.write(soma)

    </script>
</body>
</html>
