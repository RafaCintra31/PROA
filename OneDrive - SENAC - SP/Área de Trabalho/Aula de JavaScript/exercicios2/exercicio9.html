<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 09</title>
</head>
<body>
    <!-- Informar um saldo e mostrar na tela o saldo com reajuste de 1.5%.-->
    <h1>Exercicio 09</h1>

    <script>
        let saldo = parseFloat(prompt("Digite o seu saldo"))
        let reajuste = saldo * 0.015
        let valorReajuste = saldo + reajuste
        document.write(`O seu saldo é de: R$ ${saldo}`)
        document.write(`<br> O seu reajuste é de: R$ ${valorReajuste}`)
    </script>
</body>
</html>
