<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 05</title>
</head>
<body>
    <!--Desenvolva um programa em javascript que leia um número inteiro e mostre na tela o seu antecessor e seu sucessor.-->
    <h1>Exercicio 05</h1>

    <script>
        let num = parseInt(prompt("Digite um número"))

        document.write(`Seu número é; ${num}`)
        num--
        document.write(`<br> O número antecessor do seu é ${num}`)
        num++
        num++
        document.write(`<br> O númedo sucessor so seu é ${num}`)
    </script>
</body>
</html>
