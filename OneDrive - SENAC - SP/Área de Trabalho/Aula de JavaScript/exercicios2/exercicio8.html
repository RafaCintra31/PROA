    <!-- Crie um programa que leia o valor do salário mínimo e o valor do salário de um usuário, calcule a quantidade de salários mínimos esse usuário ganha e imprima o resultado. (Salário mínimo = R$1.212,00). -->
    <h1>Exercicio 08</h1>

    <script>
        let salarioMin = 1621
        let salarioMinUsuario = parseFloat(prompt("Digite o seu salário"))

        let quatSalarioMin = Math.round((salarioMinUsuario / salarioMin)*10) / 10

        document.write(`<br> O salário mínimo de 2026 é de: R$ ${salarioMin} reais`)
        document.write(`<br> O salário do usuário é de: R$ ${salarioMinUsuario} reais`)
    </script>
