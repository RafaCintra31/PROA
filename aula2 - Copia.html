<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segunda Aula HTML</title>

    <style>

        body{
            background-color: rgb(241,151,211);
            color: #90b;/*Muda a cor da fonte*/
            font-size: 20px;
            font-family: Verdana;
            text-align: center;
            background-image: url(Imagens/Plano\ azul\ e\ amarelo.jpg); /*Tag insere uma imagem no fundo do componente*/
            background-repeat: no-repeat; /*Tag para não repetir a imagem*/
            background-size: cover; /*Tag usada para ajutar a imagem na área disponível*/
            background-attachment: fixed; /*Tag para deixar a imagem fixada no plano de fundo*/
        }

        h1{
            background-color: white;
            color: black;
            font-weight: normal; /*Tag para retirar o negrito ou colocar negrito*/
        }

        p{
            background-color: black;
            color: white;
            text-align: justify;
            width: 600px;
            height: 150px;
            margin: 30px;/*Tag determina o tamanho da margem para os 4 lados do compenente*/
            margin-left: 60px;
            padding: 10px;/*Tag para espaço para dentro da área*/
            border: 5px;
            border-style: solid;
            border-color: blue;
            border-radius: 20px; /*Tag para arredondar as bordas*/
        }

        img{
            width: 300px;
            height: 350px;
            margin-top: 200px;
            border: 10px dotted black; /*Usar 3 atribulos em uma tag só*/
        }

        hr{
            width: 50%;
            height: 5px;
            background-color: black;
        }

    </style>
</head>
<body>
    <h1> Testanto título na página </h1>

    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Illum dolorum obcaecati doloribus minus ipsa quaerat <br /> quisquam voluptas numquam neque asperiores qui ipsam blanditiis quibusdam dolor perferendis molestiae, quia eius corporis!</p>
    <hr />
    
    <img src="Imagens/Coelho e ovos.jpg" />


</body>
</html>
